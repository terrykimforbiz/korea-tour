<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JEJU 济州岛之旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #ffffff;
  --card: #ffffff;
  --card-hover: #efe8f8;
  --primary: #b39ddb;
  --primary-dark: #9575cd;
  --primary-light: #e1bee7;
  --gold: #ce93d8;
  --text: #4a4a4a;
  --text-dim: #999;
  --blue: #90caf9;
  --green: #a5d6a7;
  --orange: #ffcc80;
  --gray: #bdbdbd;
  --border: rgba(0,0,0,.06);
  --radius: 12px;
  --nav-h: 64px;
  --header-h: 52px;
}

html, body {
  height: 100%;
  font-family: 'ZCOOL KuaiLe', 'ZCOOL XiaoWei', cursive, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ── Header ── */
header {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: linear-gradient(135deg, #b39ddb 0%, #ce93d8 50%, #f48fb1 100%);
  border-bottom: none;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px;
  z-index: 1000;
  box-shadow: 0 2px 12px rgba(179,157,219,.3);
}

header::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, #e1bee7, #f8bbd0, #e1bee7);
  opacity: .7;
}

.header-title {
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 18px;
  color: #fff;
  letter-spacing: 1px;
  text-shadow: 0 1px 4px rgba(0,0,0,.1);
}

.header-right {
  display: flex; align-items: center; gap: 10px;
  font-size: 12px;
}

.tw-time {
  color: rgba(255,255,255,.85);
  font-variant-numeric: tabular-nums;
  font-size: 11px;
}

.btn-copy {
  background: rgba(255,255,255,.25);
  border: 1px solid rgba(255,255,255,.35);
  color: #fff;
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  transition: all .2s;
  white-space: nowrap;
}
.btn-copy:active { transform: scale(.95); background: rgba(255,255,255,.4); }

/* ── Tab bar ── */
nav.tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: var(--nav-h);
  background: #fff;
  border-top: 1px solid var(--border);
  display: flex; align-items: stretch;
  z-index: 1000;
  padding-bottom: env(safe-area-inset-bottom, 0);
  box-shadow: 0 -2px 10px rgba(0,0,0,.04);
}

nav.tab-bar button {
  flex: 1;
  background: none; border: none;
  color: var(--text-dim);
  font-family: inherit;
  font-size: 10px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 3px;
  cursor: pointer;
  transition: color .2s;
  position: relative;
}

nav.tab-bar button .tab-icon { font-size: 22px; line-height: 1; }

nav.tab-bar button.active {
  color: var(--primary-dark);
}

nav.tab-bar button.active::before {
  content: '';
  position: absolute; top: 0; left: 25%; right: 25%;
  height: 2px;
  background: var(--primary);
  border-radius: 0 0 2px 2px;
  box-shadow: 0 0 10px var(--primary);
}

/* ── Main content ── */
.tab-content {
  position: fixed;
  top: var(--header-h);
  bottom: var(--nav-h);
  left: 0; right: 0;
  overflow-y: auto;
  overflow-x: hidden;
  display: none;
  -webkit-overflow-scrolling: touch;
}
.tab-content.active { display: block; }

/* ── Map tab ── */
#tab-map { display: none; }
#tab-map.active { display: flex; flex-direction: column; }

.map-date-bar {
  display: flex; gap: 6px;
  padding: 10px 12px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
}

.map-date-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: all .2s;
}
.map-date-btn.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  box-shadow: 0 2px 8px rgba(179,157,219,.3);
}

#map-container {
  flex: 1;
  min-height: 0;
}

/* Leaflet popup */
.leaflet-popup-content-wrapper {
  background: var(--card) !important;
  color: var(--text) !important;
  border-radius: 10px !important;
  border: 1px solid var(--border) !important;
  box-shadow: 0 4px 20px rgba(0,0,0,.1) !important;
}
.leaflet-popup-tip { background: var(--card) !important; }
.leaflet-popup-content { margin: 10px 14px !important; font-size: 13px !important; font-family: 'ZCOOL KuaiLe', cursive !important; }
.popup-title { font-weight: 700; margin-bottom: 6px; }
.popup-gmaps {
  display: inline-block;
  margin-top: 6px;
  padding: 4px 10px;
  background: var(--primary);
  color: #fff;
  border-radius: 6px;
  font-size: 11px;
  text-decoration: none;
}

/* ── Schedule tab ── */
.schedule-wrap {
  overflow-x: auto;
  padding: 12px;
  min-height: 100%;
}

.schedule-table {
  border-collapse: separate;
  border-spacing: 0;
  width: max-content;
  min-width: 100%;
}

.schedule-table th {
  position: sticky; top: 0;
  background: var(--bg);
  padding: 8px 6px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-dim);
  text-align: center;
  z-index: 2;
  min-width: 120px;
}

.schedule-table th.time-col {
  min-width: 50px;
  width: 50px;
}

.schedule-table th .day-date {
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 14px;
  color: var(--text);
  display: block;
}

.schedule-table td {
  border: 1px solid var(--border);
  padding: 4px;
  vertical-align: top;
  min-height: 44px;
  min-width: 120px;
  cursor: pointer;
  transition: background .15s;
}

.schedule-table td:hover {
  background: rgba(179,157,219,.06);
}

.schedule-table td.time-cell {
  text-align: center;
  font-size: 11px;
  color: var(--text-dim);
  cursor: default;
  min-width: 50px;
  width: 50px;
  font-variant-numeric: tabular-nums;
  vertical-align: middle;
  border: none;
}

.sched-card {
  background: var(--bg);
  border-radius: 8px;
  padding: 5px 8px;
  font-size: 11px;
  margin-bottom: 3px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  border-left: 3px solid var(--text-dim);
  transition: background .15s;
  position: relative;
}
.sched-card:hover { background: #ece4f6; }
.sched-card .sc-emoji { font-size: 13px; flex-shrink: 0; }
.sched-card .sc-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
.sched-card .sc-memo { font-size: 9px; color: var(--text-dim); display: block; margin-top: 1px; }

/* ── Places tab ── */
.places-wrap {
  padding: 12px;
}

.filter-bar {
  display: flex; gap: 6px;
  overflow-x: auto;
  padding-bottom: 12px;
  flex-wrap: nowrap;
}

.filter-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: all .2s;
}
.filter-btn.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

.places-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.place-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 12px;
  border: 1px solid var(--border);
  transition: all .2s;
  display: flex; flex-direction: column; gap: 6px;
  box-shadow: 0 1px 6px rgba(179,157,219,.08);
}
.place-card:hover { border-color: rgba(179,157,219,.3); box-shadow: 0 2px 12px rgba(179,157,219,.15); }

.place-card .pc-top {
  display: flex; align-items: center; gap: 6px;
}
.place-card .pc-emoji { font-size: 20px; }
.place-card .pc-name { font-size: 12px; font-weight: 500; line-height: 1.3; flex: 1; }

.place-card .pc-cat {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  display: inline-block;
  width: fit-content;
}

.place-card .pc-actions {
  display: flex; gap: 4px; margin-top: auto;
}

.pc-btn {
  flex: 1;
  padding: 5px 0;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-dim);
  font-size: 10px;
  cursor: pointer;
  font-family: inherit;
  transition: all .15s;
  text-align: center;
}
.pc-btn:active { transform: scale(.96); }
.pc-btn.danger { color: #e57373; border-color: rgba(229,115,115,.2); }
.pc-btn.danger:hover { background: rgba(229,115,115,.06); }

.add-place-btn {
  display: block;
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  border-radius: var(--radius);
  border: 2px dashed rgba(179,157,219,.3);
  background: transparent;
  color: var(--text-dim);
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
}
.add-place-btn:hover { border-color: var(--primary); color: var(--primary); }

/* ── Memo tab ── */
.memo-wrap { padding: 12px; }

.memo-date-bar {
  display: flex; gap: 6px;
  margin-bottom: 12px;
  overflow-x: auto;
}

.memo-date-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: all .2s;
}
.memo-date-btn.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

.memo-textarea {
  width: 100%;
  min-height: calc(100vh - var(--header-h) - var(--nav-h) - 80px);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 14px;
  padding: 14px;
  resize: none;
  outline: none;
  line-height: 1.7;
}
.memo-textarea:focus { border-color: var(--primary); }
.memo-textarea::placeholder { color: var(--text-dim); }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.35);
  backdrop-filter: blur(4px);
  z-index: 2000;
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity .25s;
}
.modal-overlay.show { opacity: 1; pointer-events: auto; }

.modal-sheet {
  background: var(--card);
  border-radius: 18px 18px 0 0;
  width: 100%;
  max-width: 500px;
  max-height: 80vh;
  overflow-y: auto;
  padding: 20px 16px;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.32,.72,0,1);
  box-shadow: 0 -4px 30px rgba(0,0,0,.1);
}
.modal-overlay.show .modal-sheet { transform: translateY(0); }

.modal-handle {
  width: 36px; height: 4px;
  background: rgba(179,157,219,.3);
  border-radius: 2px;
  margin: 0 auto 16px;
}

.modal-title {
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 16px;
  margin-bottom: 16px;
  color: var(--primary-dark);
}

.modal-field { margin-bottom: 12px; }
.modal-field label {
  display: block;
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 4px;
}

.modal-field input, .modal-field select, .modal-field textarea {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  outline: none;
}
.modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus {
  border-color: var(--primary);
}
.modal-field select { cursor: pointer; }
.modal-field select option { background: var(--bg); }

.modal-actions {
  display: flex; gap: 8px;
  margin-top: 16px;
}

.modal-btn {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s;
}
.modal-btn.primary { background: var(--primary); color: #fff; }
.modal-btn.primary:active { transform: scale(.97); }
.modal-btn.secondary { background: var(--bg); color: var(--text-dim); }

/* Place picker inside modal */
.place-picker-list {
  max-height: 50vh;
  overflow-y: auto;
}

.place-pick-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: background .15s;
}
.place-pick-item:hover { background: var(--bg); }
.place-pick-item .ppi-emoji { font-size: 22px; }
.place-pick-item .ppi-name { font-size: 13px; flex: 1; }
.place-pick-item .ppi-cat { font-size: 10px; color: var(--text-dim); }

/* Schedule card detail modal */
.card-detail-modal .cd-place {
  display: flex; align-items: center; gap: 8px;
  font-size: 16px; font-weight: 700;
  margin-bottom: 12px;
}

.card-detail-modal .cd-actions {
  display: flex; flex-direction: column; gap: 8px;
}

.cd-action-btn {
  display: block;
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  text-align: left;
  transition: all .15s;
}
.cd-action-btn:hover { background: #ece4f6; }
.cd-action-btn.danger { color: #e57373; border-color: rgba(229,115,115,.2); }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(179,157,219,.25); border-radius: 2px; }

.schedule-table td.half-hour,
.schedule-table td.time-cell.half-hour {
  border-top-style: dashed;
  border-top-color: rgba(0,0,0,.04);
}
.schedule-table td.time-cell.half-hour {
  font-size: 10px;
  color: #bbb;
}

.dist-measure-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: all .2s;
  margin-left: auto;
}
.dist-measure-btn.active {
  background: var(--gold);
  color: #fff;
  border-color: var(--gold);
}

/* Schedule add-place modal filter */
.modal-filter-bar {
  display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; flex-wrap: nowrap;
}
</style>
</head>
<body>

<header>
  <div class="header-title">🍊 JEJU 济州岛之旅</div>
  <div class="header-right">
    <span class="tw-time" id="twTime"></span>
    <button class="btn-copy" id="btnCopy" onclick="copyLink()">复制链接</button>
  </div>
</header>

<!-- Map -->
<div class="tab-content active" id="tab-map">
  <div class="map-date-bar" id="mapDateBar"></div>
  <div id="distanceBar" style="display:none;padding:8px 12px;background:#f3e5f5;font-size:12px;border-bottom:1px solid var(--border);flex-shrink:0"></div>
  <div id="map-container"></div>
</div>

<!-- Schedule -->
<div class="tab-content" id="tab-schedule">
  <div class="schedule-wrap" id="scheduleWrap"></div>
</div>

<!-- Places -->
<div class="tab-content" id="tab-places">
  <div class="places-wrap" id="placesWrap"></div>
</div>

<!-- Memo -->
<div class="tab-content" id="tab-memo">
  <div class="memo-wrap" id="memoWrap"></div>
</div>

<!-- Tab bar -->
<nav class="tab-bar">
  <button class="active" data-tab="tab-map"><span class="tab-icon">🗺️</span>地图</button>
  <button data-tab="tab-schedule"><span class="tab-icon">📅</span>行程</button>
  <button data-tab="tab-places"><span class="tab-icon">📍</span>景点</button>
  <button data-tab="tab-memo"><span class="tab-icon">📝</span>备忘</button>
</nav>

<!-- Modal container -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBg(event)">
  <div class="modal-sheet" id="modalSheet"></div>
</div>

<script>
// ─── Data ───
const DATES = ['0319','0320','0321','0322'];
const DATE_LABELS = { '0319':'3/19 三', '0320':'3/20 四', '0321':'3/21 五', '0322':'3/22 六' };
const DATE_SHORT = { '0319':'3/19', '0320':'3/20', '0321':'3/21', '0322':'3/22' };
const DATE_COLORS = { '0319':'#c8a2c8', '0320':'#90caf9', '0321':'#a5d6a7', '0322':'#ffcc80' };
const TIME_SLOTS = [];
for (let h = 6; h <= 23; h++) {
  TIME_SLOTS.push(h + ':00');
  TIME_SLOTS.push(h + ':30');
}

const CATEGORY_STYLE = {
  hotel:     { color: '#90caf9', label: '住宿' },
  food:      { color: '#ffcc80', label: '美食' },
  sight:     { color: '#a5d6a7', label: '观光' },
  transport: { color: '#bdbdbd', label: '交通' },
};

const CATEGORY_EMOJI = { hotel:'🏨', food:'🍜', sight:'🗺️', transport:'🚇' };

// 地区排列顺序 (济州岛)
const DISTRICT_ORDER = ['济州市','济州国际机场','涯月邑','翰林邑','朝天邑','旧左邑','表善面','南元邑','西归浦市','中文','大静邑','安德面'];

// 中文/英文→韩文 常用地名映射（用于地图搜索）
const TO_KR_MAP = {
  // 中文→韩文
  '济州':'제주','济州岛':'제주도','济州市':'제주시','西归浦':'서귀포','西归浦市':'서귀포시',
  '涯月':'애월','涯月邑':'애월읍','翰林':'한림','翰林邑':'한림읍','朝天':'조천','朝天邑':'조천읍',
  '旧左':'구좌','旧左邑':'구좌읍','表善':'표선','表善面':'표선면','南元':'남원','南元邑':'남원읍',
  '大静':'대정','大静邑':'대정읍','安德':'안덕','安德面':'안덕면','中文':'중문',
  '汉拿山':'한라산','城山日出峰':'성산일출봉','牛岛':'우도','天帝渊瀑布':'천제연폭포',
  '天地渊瀑布':'천지연폭포','正房瀑布':'정방폭포','柱状节理带':'주상절리대',
  '万丈窟':'만장굴','龙头岩':'용두암','东门市场':'동문시장',
  '济州国际机场':'제주국제공항','机场':'제주공항','月汀里海边':'월정리해변',
  '挟才海水浴场':'협재해수욕장','咸德海水浴场':'함덕해수욕장','山房山':'산방산',
  '泰迪熊博物馆':'테디베어뮤지엄 제주','雪绿茶博物馆':'오설록 티뮤지엄',
  '涉地可支':'섭지코지','黑猪肉':'흑돼지','海鲜锅':'해물탕',
  '烤肉':'고기구이','咖啡厅':'카페','酒店':'호텔','民宿':'민박',
  '瀑布':'폭포','海边':'해변','市场':'시장','博物馆':'박물관','公园':'공원',
  '寺庙':'사찰','海水浴场':'해수욕장','灯塔':'등대','森林':'숲','山':'산',
  // 英文→韩文
  'Jeju':'제주','Seogwipo':'서귀포','Aewol':'애월','Hallim':'한림',

// 将中文/英文名称转换为韩文用于地图搜索
function toSearchName(name) {
  // 直接匹配完整名称
  if (TO_KR_MAP[name]) return TO_KR_MAP[name];
  // 尝试替换已知词汇为韩文
  let result = name;
  const sorted = Object.keys(TO_KR_MAP).sort((a, b) => b.length - a.length);
  for (const key of sorted) {
    if (result.includes(key)) {
      result = result.replace(new RegExp(key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), TO_KR_MAP[key]);
    }
  }
  return result;
}

const PRESET_PLACES = [];

// ─── State ───
let state = {
  schedule: {},
  customPlaces: [],
  hiddenPlaces: [],
  placeEdits: {},
  memos: { '0319':'', '0320':'', '0321':'', '0322':'', 'common':'' }
};

function allPlaces() {
  const hidden = new Set(state.hiddenPlaces || []);
  const edits = state.placeEdits || {};
  return [...PRESET_PLACES.filter(p => !hidden.has(p.id)).map(p => {
    const e = edits[p.id];
    return e ? { ...p, ...e } : p;
  }), ...state.customPlaces];
}

function findPlace(id) {
  return allPlaces().find(p => p.id === id);
}

function saveToUrl() {
  try {
    const json = JSON.stringify(state);
    const encoded = btoa(unescape(encodeURIComponent(json)));
    history.replaceState(null, '', '#' + encoded);
  } catch(e) { console.error('Save error', e); }
}

function loadFromUrl() {
  const hash = location.hash.slice(1);
  if (!hash) return null;
  try {
    return JSON.parse(decodeURIComponent(escape(atob(hash))));
  } catch { return null; }
}

function initState() {
  const saved = loadFromUrl();
  if (saved) {
    state.schedule = saved.schedule || {};
    state.customPlaces = saved.customPlaces || [];
    state.hiddenPlaces = saved.hiddenPlaces || [];
    state.placeEdits = saved.placeEdits || {};
    state.memos = { '0319':'', '0320':'', '0321':'', '0322':'', 'common':'', ...(saved.memos || {}) };
  }
}

// ─── MAP ───
let map, mapMarkers = [], mapLines = [], selectedMapDate = 'all';
let distMode = false, distPoints = [], distLine = null, distMarkerIcons = [];

function toggleDistMode() {
  distMode = !distMode;
  const btn = document.getElementById('distModeBtn');
  btn.classList.toggle('active', distMode);
  btn.textContent = distMode ? '测距 ON' : '测距';
  distPoints = [];
  if (distLine) { map.removeLayer(distLine); distLine = null; }
  document.getElementById('distanceBar').style.display = 'none';
  document.getElementById('distanceBar').textContent = '';
}

function handleDistClick(latlng, placeName) {
  if (!distMode) return;
  distPoints.push({ latlng, name: placeName });
  if (distPoints.length === 2) {
    const [a, b] = distPoints;
    const dist = map.distance(a.latlng, b.latlng);
    let distStr = dist >= 1000 ? (dist/1000).toFixed(2) + ' km' : Math.round(dist) + ' m';
    if (distLine) map.removeLayer(distLine);
    distLine = L.polyline([a.latlng, b.latlng], { color: '#b39ddb', weight: 2, dashArray: '6,4' }).addTo(map);
    const bar = document.getElementById('distanceBar');
    bar.style.display = 'block';
    bar.innerHTML = `<b>${a.name}</b> ↔ <b>${b.name}</b> : 直线 <b>${distStr}</b> <button onclick="clearDist()" style="margin-left:8px;border:none;background:none;color:var(--primary-dark);cursor:pointer;font-family:inherit">重置</button>`;
    distPoints = [];
  } else {
    const bar = document.getElementById('distanceBar');
    bar.style.display = 'block';
    bar.textContent = `${distPoints[0].name} 已选择 — 请点击第二个景点`;
  }
}

function clearDist() {
  distPoints = [];
  if (distLine) { map.removeLayer(distLine); distLine = null; }
  document.getElementById('distanceBar').style.display = 'none';
}

function initMap() {
  map = L.map('map-container', { zoomControl: false }).setView([33.38, 126.55], 11);
  L.control.zoom({ position: 'topright' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
    maxZoom: 20,
    subdomains: 'abcd'
  }).addTo(map);

  // Date buttons
  const bar = document.getElementById('mapDateBar');
  const allBtn = document.createElement('button');
  allBtn.className = 'map-date-btn active';
  allBtn.textContent = '全部';
  allBtn.onclick = () => { selectedMapDate = 'all'; updateMapDateBtns(); updateMapMarkers(); };
  bar.appendChild(allBtn);

  DATES.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'map-date-btn';
    btn.textContent = DATE_SHORT[d];
    btn.style.setProperty('--dc', DATE_COLORS[d]);
    btn.onclick = () => { selectedMapDate = d; updateMapDateBtns(); updateMapMarkers(); };
    bar.appendChild(btn);
  });

  const distBtn = document.createElement('button');
  distBtn.id = 'distModeBtn';
  distBtn.className = 'dist-measure-btn';
  distBtn.textContent = '测距';
  distBtn.onclick = toggleDistMode;
  bar.appendChild(distBtn);
}

function updateMapDateBtns() {
  document.querySelectorAll('.map-date-btn').forEach((btn, i) => {
    btn.classList.remove('active');
    if (i === 0 && selectedMapDate === 'all') btn.classList.add('active');
    else if (i > 0 && DATES[i-1] === selectedMapDate) {
      btn.classList.add('active');
      btn.style.background = DATE_COLORS[selectedMapDate];
      btn.style.borderColor = DATE_COLORS[selectedMapDate];
      btn.style.color = '#fff';
    } else {
      btn.style.background = '';
      btn.style.borderColor = '';
      btn.style.color = '';
    }
  });
}

function updateMapMarkers() {
  mapMarkers.forEach(m => map.removeLayer(m));
  mapLines.forEach(l => map.removeLayer(l));
  mapMarkers = [];
  mapLines = [];

  const datesToShow = selectedMapDate === 'all' ? DATES : [selectedMapDate];
  const bounds = [];

  datesToShow.forEach(date => {
    const color = DATE_COLORS[date];
    const dayPoints = [];

    const entries = [];
    TIME_SLOTS.forEach(slot => {
      const key = date + '_' + slot;
      if (state.schedule[key]) {
        state.schedule[key].forEach(item => {
          const place = findPlace(item.placeId);
          if (place && place.lat) {
            entries.push({ place, slot, memo: item.memo });
          }
        });
      }
    });

    entries.forEach(({ place, slot, memo }, idx) => {
      const num = idx + 1;
      const icon = L.divIcon({
        className: '',
        html: `<div style="position:relative;width:32px;height:32px;">
          <div style="width:32px;height:32px;border-radius:50%;
            background:${color};border:2px solid #fff;
            display:flex;align-items:center;justify-content:center;
            font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.4);
          ">${place.emoji}</div>
          <div style="position:absolute;top:-6px;right:-6px;
            width:18px;height:18px;border-radius:50%;
            background:#fff;color:${color};
            font-size:10px;font-weight:900;
            display:flex;align-items:center;justify-content:center;
            box-shadow:0 1px 4px rgba(0,0,0,.3);
            font-family:'ZCOOL KuaiLe',cursive;
          ">${num}</div>
        </div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });

      const marker = L.marker([place.lat, place.lng], { icon }).addTo(map);
      marker.bindPopup(`
        <div class="popup-title">${place.emoji} ${place.name}</div>
        <div style="color:var(--text-dim);font-size:11px;">${DATE_SHORT[date]} ${slot}</div>
        ${memo ? `<div style="margin-top:4px;font-size:11px;">${memo}</div>` : ''}
        <a class="popup-gmaps" href="${place.mapUrl}" target="_blank">📍 打开地图</a>
      `);
      marker.on('click', () => handleDistClick(L.latLng(place.lat, place.lng), place.name));
      mapMarkers.push(marker);
      dayPoints.push([place.lat, place.lng]);
      bounds.push([place.lat, place.lng]);
    });

    if (dayPoints.length > 1) {
      const line = L.polyline(dayPoints, { color, weight: 5, opacity: 0.9 }).addTo(map);
      mapLines.push(line);
    }
  });

  if (bounds.length > 0) {
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
  }
}

function renderSchedule() {
  const wrap = document.getElementById('scheduleWrap');
  let html = '<table class="schedule-table"><thead><tr><th class="time-col">时间</th>';
  DATES.forEach(d => {
    html += `<th><span class="day-date" style="color:${DATE_COLORS[d]}">${DATE_LABELS[d]}</span></th>`;
  });
  html += '</tr></thead><tbody>';

  TIME_SLOTS.forEach(slot => {
    const hh = slot.split(':')[0].padStart(2,'0') + ':' + slot.split(':')[1];
    const isHalf = slot.endsWith(':30');
    html += `<tr><td class="time-cell${isHalf ? ' half-hour' : ''}">${hh}</td>`;
    DATES.forEach(d => {
      const key = d + '_' + slot;
      const items = state.schedule[key] || [];
      html += `<td class="${isHalf ? 'half-hour' : ''}" onclick="openPlacePicker('${key}')">`;
      items.forEach((item, idx) => {
        const place = findPlace(item.placeId);
        if (place) {
          const catColor = CATEGORY_STYLE[place.category]?.color || '#888';
          html += `<div class="sched-card" style="border-left-color:${catColor}" onclick="event.stopPropagation();openCardDetail('${key}',${idx})">
            <span class="sc-emoji">${place.emoji}</span>
            <span class="sc-name">${place.name}</span>
            ${item.memo ? `<span class="sc-memo">${item.memo}</span>` : ''}
          </div>`;
        }
      });
      html += '</td>';
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  wrap.innerHTML = html;
}

      </div>

  }

  const cats = [
    { key:'all', label:'全部' },
    { key:'hotel', label:'🏨 住宿' },
    { key:'food', label:'🍜 美食' },
    { key:'sight', label:'🗺️ 观光' },

    event.target.classList.add('active');
    const places = allPlaces().filter(p => filterCat === 'all' || p.category === filterCat);
    document.getElementById('pickerList').innerHTML = places.map(p => `
      <div class="place-pick-item" onclick="addToSchedule('${slotKey}','${p.id}')">
        <span class="ppi-emoji">${p.emoji}</span>
        <span class="ppi-name">${p.name}</span>
        <span class="ppi-cat" style="color:${CATEGORY_STYLE[p.category]?.color || '#888'}">${CATEGORY_STYLE[p.category]?.label || ''}</span>

}

function addToSchedule(slotKey, placeId) {
  if (!state.schedule[slotKey]) state.schedule[slotKey] = [];
  state.schedule[slotKey].push({ placeId, memo: '' });
  saveToUrl();
  closeModal();
  renderSchedule();
}

function openCardDetail(slotKey, idx) {
  const item = state.schedule[slotKey]?.[idx];
  if (!item) return;
  const place = findPlace(item.placeId);
  if (!place) return;

  openModal(`
    <div class="card-detail-modal">
      <div class="cd-place"><span style="font-size:28px">${place.emoji}</span> ${place.name}</div>
      <div class="modal-field">
        <label>备注</label>
        <input type="text" id="cdMemo" value="${item.memo || ''}" placeholder="输入备注..." onchange="updateCardMemo('${slotKey}',${idx},this.value)">
      </div>
      <div class="cd-actions">
        <a class="cd-action-btn" href="${place.mapUrl}" target="_blank">📍 打开地图</a>
        <button class="cd-action-btn danger" onclick="removeFromSchedule('${slotKey}',${idx})">🗑️ 删除</button>
      </div>
    </div>
  `);
}

function updateCardMemo(slotKey, idx, memo) {
  if (state.schedule[slotKey]?.[idx]) {
    state.schedule[slotKey][idx].memo = memo;
    saveToUrl();
  }
}

function removeFromSchedule(slotKey, idx) {
  if (state.schedule[slotKey]) {
    state.schedule[slotKey].splice(idx, 1);
    if (state.schedule[slotKey].length === 0) delete state.schedule[slotKey];
    saveToUrl();
    closeModal();
    renderSchedule();
  }
}

function toggleSchedSlot(btn, key) {
  if (window._schedAddSelected.has(key)) {
    window._schedAddSelected.delete(key);
    btn.classList.remove('active');
  } else {
    window._schedAddSelected.add(key);
    btn.classList.add('active');
  }
  const cnt = window._schedAddSelected.size;
  const confirmBtn = document.getElementById('schedAddConfirm');
  confirmBtn.textContent = `确认 (${cnt}个)`;
  confirmBtn.disabled = cnt === 0;
  confirmBtn.style.opacity = cnt === 0 ? '.5' : '1';
}

  closeModal();
  renderSchedule();
  renderPlaces();
}

async function addCustomPlace() {
  const name = document.getElementById('newPlaceName').value.trim();
  if (!name) return;

  // 버튼 로딩 상태
  const btn = document.getElementById('addPlaceBtn');
  btn.disabled = true;
  btn.textContent = '搜索中...';

  const cat = document.getElementById('newPlaceCat').value;
  const district = document.getElementById('newPlaceDistrict').value.trim();
  const desc = document.getElementById('newPlaceDesc').value.trim();
  const url = document.getElementById('newPlaceUrl').value.trim();
  let lat = parseFloat(document.getElementById('newPlaceLat').value) || null;
  let lng = parseFloat(document.getElementById('newPlaceLng').value) || null;

  const id = 'c' + Date.now();
  const emoji = CATEGORY_EMOJI[cat] || '📍';
  const krName = toSearchName(name);
  const mapUrl = url || `https://map.kakao.com/?q=${encodeURIComponent(krName)}`;

  // 위도/경도 미입력 시 한국어로 변환 후 자동 검색
  if (!lat || !lng) {
    try {
      const coords = await geocodePlace(krName);
      if (coords) {
        lat = coords.lat;
        lng = coords.lng;
      }
    } catch(e) {
      console.error('Geocode failed', e);
    }
  }

  state.customPlaces.push({ id, name, category: cat, emoji, district, desc, mapUrl, lat, lng });
  saveToUrl();
  closeModal();
  renderPlaces();
}

// Nominatim 지오코딩 - 한국어로 변환 후 좌표 자동 검색
async function geocodePlace(krName) {
  // 제주도 범위 내에서 한국어로 검색
  const query = krName + ' 제주';
  const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&viewbox=126.1,33.1,127.0,33.6&bounded=0&limit=1`;
  try {
    const res = await fetch(url, { headers: { 'Accept-Language': 'ko' } });
    const data = await res.json();
    if (data && data.length > 0) {
      return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
    }
    // 제주 없이 재시도
    const url2 = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(krName)}&limit=1`;
    const res2 = await fetch(url2, { headers: { 'Accept-Language': 'ko' } });
    const data2 = await res2.json();
    if (data2 && data2.length > 0) {
      return { lat: parseFloat(data2[0].lat), lng: parseFloat(data2[0].lon) };
    }
  } catch(e) { console.error('Geocode error', e); }
  return null;
}

function openPlaceEditModal(id) {

  const nameEscaped = (place.name || '').replace(/"/g, '&quot;');
  const descEscaped = (place.desc || '').replace(/"/g, '&quot;');

  openModal(`
    <div class="modal-title">编辑景点</div>
    <div class="modal-field">
      <label>景点名称</label>
      <input type="text" id="editPlaceName" value="${nameEscaped}" placeholder="景点名称...">
    </div>
    <div class="modal-field">
      <label>类别</label>
      <select id="editPlaceCat">
        <option value="hotel" ${place.category==='hotel'?'selected':''}>🏨 住宿</option>
        <option value="food" ${place.category==='food'?'selected':''}>🍜 美食</option>
        <option value="sight" ${place.category==='sight'?'selected':''}>🗺️ 观光</option>
        <option value="transport" ${place.category==='transport'?'selected':''}>🚇 交通</option>
      </select>
    </div>
    <div class="modal-field">
      <label>地区</label>
      <input type="text" id="editPlaceDistrict" value="${districtEscaped}" placeholder="例如：济州市、西归浦市...">
    </div>
    <div class="modal-field">
      <label>说明</label>
      <input type="text" id="editPlaceDesc" value="${descEscaped}" placeholder="关于景点的说明...">
    </div>
    <div class="modal-field">
      <label>地图链接</label>
      <input type="text" id="editPlaceUrl" value="${urlEscaped}" placeholder="https://...">
    </div>
    <div class="modal-field">
      <label>纬度（留空自动搜索）</label>
      <input type="number" step="any" id="editPlaceLat" value="${place.lat||''}" placeholder="自动获取">
    </div>
    <div class="modal-field">
      <label>经度（留空自动搜索）</label>
      <input type="number" step="any" id="editPlaceLng" value="${place.lng||''}" placeholder="自动获取">
    </div>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeModal()">取消</button>
      <button class="modal-btn primary" id="editPlaceBtn" onclick="savePlaceEdit('${id}').catch(e=>console.error(e))">保存</button>
    </div>
  `);
}

async function savePlaceEdit(id) {
  const btn = document.getElementById('editPlaceBtn');
  btn.disabled = true;
  btn.textContent = '保存中...';

  const name = document.getElementById('editPlaceName').value.trim();
  const category = document.getElementById('editPlaceCat').value;
  const district = document.getElementById('editPlaceDistrict').value.trim();
  const desc = document.getElementById('editPlaceDesc').value.trim();
  const mapUrl = document.getElementById('editPlaceUrl').value.trim();
  let lat = parseFloat(document.getElementById('editPlaceLat').value) || null;
  let lng = parseFloat(document.getElementById('editPlaceLng').value) || null;
  const emoji = CATEGORY_EMOJI[category] || '📍';

  // 좌표 없으면 자동 검색
  if (!lat || !lng) {
    try {
      const krName = toSearchName(name);
      const coords = await geocodePlace(krName);
      if (coords) { lat = coords.lat; lng = coords.lng; }
    } catch(e) { console.error('Geocode failed', e); }
  }

  const krName = toSearchName(name);
  const finalMapUrl = mapUrl || `https://map.kakao.com/?q=${encodeURIComponent(krName)}`;

  if (id.startsWith('c')) {
    const cp = state.customPlaces.find(p => p.id === id);
    if (cp) {
      cp.name = name; cp.category = category; cp.emoji = emoji;
      cp.district = district; cp.desc = desc; cp.mapUrl = finalMapUrl;
      cp.lat = lat; cp.lng = lng;
    }
  } else {
    if (!state.placeEdits) state.placeEdits = {};
    state.placeEdits[id] = { name, category, emoji, district, desc, mapUrl: finalMapUrl, lat, lng };
  }
  saveToUrl();
  closeModal();
  renderPlaces();
}

function deletePlace(id) {
  if (id.startsWith('c')) {
    state.customPlaces = state.customPlaces.filter(p => p.id !== id);
  } else {
    if (!state.hiddenPlaces) state.hiddenPlaces = [];
    if (!state.hiddenPlaces.includes(id)) state.hiddenPlaces.push(id);
  }
  Object.keys(state.schedule).forEach(key => {
    state.schedule[key] = state.schedule[key].filter(item => item.placeId !== id);
    if (state.schedule[key].length === 0) delete state.schedule[key];
  });
  saveToUrl();
  renderPlaces();
}

function renderMemo() {
  const wrap = document.getElementById('memoWrap');
  const tabs = ['common', ...DATES];
  const tabLabels = { ...DATE_SHORT, common: '通用' };

  let html = '<div class="memo-date-bar">';
  tabs.forEach(t => {
    html += `<button class="memo-date-btn${t===memoTab?' active':''}" onclick="switchMemoTab('${t}')">${tabLabels[t]}</button>`;
  });
  html += '</div>';
  html += `<textarea class="memo-textarea" id="memoArea" placeholder="请输入备忘录..." oninput="saveMemo()">${state.memos[memoTab] || ''}</textarea>`;
  wrap.innerHTML = html;
}

function switchMemoTab(tab) {
  memoTab = tab;
  renderMemo();
}

function saveMemo() {
  state.memos[memoTab] = document.getElementById('memoArea').value;
  saveToUrl();
}
